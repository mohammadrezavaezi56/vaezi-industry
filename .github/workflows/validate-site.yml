name: Validate website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: node --check assets/site.js
      - run: python -m json.tool news.json >/dev/null
      - run: python -m py_compile scripts/update_rss.py scripts/validate_site.py
      - run: python scripts/validate_site.py
