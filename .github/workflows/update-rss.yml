name: Update tourism RSS and local photography
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "scripts/update_rss.py"
      - "scripts/update_photos.py"
      - "news-seed.json"
      - ".github/workflows/update-rss.yml"
permissions:
  contents: write
concurrency:
  group: tourism-rss
  cancel-in-progress: false
jobs:
  update-news-and-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install image optimization dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Download and optimize locally hosted destination photos
        run: |
          python -m py_compile scripts/update_photos.py
          python scripts/update_photos.py
      - name: Refresh source-based tourism archive and RSS
        run: |
          python -m py_compile scripts/update_rss.py
          python scripts/update_rss.py
          python -m json.tool news.json >/dev/null
          python -m json.tool assets/images/credits.json >/dev/null
      - name: Commit articles and local media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json feed.xml assets/images/photos assets/images/platforms assets/images/credits.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh tourism archive and bundle optimized local photos"
            git push origin main
          else
            echo "Nothing new to publish."
          fi
